# Two app instances behind one origin (docs/08 — Multi-Instance Verification).
# ip_hash = sticky sessions, which Socket.io's long-polling transport needs.
upstream backend {
  ip_hash;
  server app1:4000;
  server app2:4000;
}

server {
  listen 80;

  location / {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;          # longer than Socket.io's 25 s ping interval
  }
}
